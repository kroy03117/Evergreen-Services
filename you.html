<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hidden Vault</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="logo-section">
            <img src="logo.png" class="logo" alt="Vault Icon">
            <h1>The Hidden Vault</h1>
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Explore</a>
            <a href="#">Discover</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <!-- MAIN SECTION -->
    <main class="main-section">

        <!-- IMAGE -->
        <div class="image-area">
            <img src="WhatsApp Image 2026-03-30 at 15.16.54.jpeg" alt="Vault Image">
        </div>

        <img
        <!-- TEXT + FORM -->
        <div class="info-area">

            <h2>Welcome to the Hidden Vault</h2>
            <p>
                Some ideas are meant to be protected. Some discoveries are meant to be earned.
                This vault holds creativity, secrets, and inspiration waiting to be unlocked.
            </p>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="message">Why should you enter the vault?</label>
                <textarea id="message"></textarea>

                <button type="submit">Request Access</button>
            </form>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>©️ 2026 The Hidden Vault | Web Development Assignment</p>
    </footer>

</body>
</html>
